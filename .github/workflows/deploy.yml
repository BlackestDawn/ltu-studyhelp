name: Check and deploy

# Single-branch repo: every push to main is checked and, if everything
# passes, deployed straight to production. There is no staging.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  REGION: ${{ secrets.GCP_REGION }}
  APP_NAME: ltu-studyhelp
  SERVICE: ltu-studyhelp
  IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/apps/ltu-studyhelp:${{ github.sha }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check code
        run: bun run lint

      - name: Check build
        run: bun run build

  e2e-tests:
    runs-on: ubuntu-latest
    # Playwright suite (e2e/) against the production bundle — the
    # webServer in playwright.config.ts builds and starts it itself.
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    needs: [checks, e2e-tests]
    runs-on: ubuntu-latest
    # GitHub creates this environment on first run and records each deploy
    # under it. Add a required reviewer in Settings > Environments if you
    # ever want a manual approval step before production.
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t "$IMAGE" .

      # Prove the exact image about to ship boots and serves the app on the
      # port Cloud Run injects, before anything is pushed.
      - name: Smoke-test image
        run: |
          docker run -d --name smoke-test -p 8080:8080 -e PORT=8080 "$IMAGE"
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/health; then
              echo
              break
            fi
            if [ "$i" = 15 ]; then
              echo "::error::Container never became healthy"
              docker logs smoke-test
              exit 1
            fi
            sleep 2
          done
          html=$(curl -fsS http://localhost:8080/m1/notes)
          for asset in $(echo "$html" | grep -oE '(src|href)="/index-[^"]+"' | sed -E 's/^(src|href)="//; s/"$//'); do
            curl -fsS -o /dev/null "http://localhost:8080$asset" && echo "ok $asset"
          done
          docker rm -f smoke-test

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Push image to Artifact Registry
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker push "$IMAGE"

      # Static app with no database or secrets. Cloud Run injects PORT
      # (8080), which src/server.ts listens on. Scales to zero when idle;
      # max-instances caps cost if a shared link gets busy.
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: --service-account=${{ secrets.GCP_RUNTIME_SA }} --allow-unauthenticated --min-instances=0 --max-instances=3 --memory=256Mi

      - name: Check the deployed service
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl -fsS "$URL/health" && echo
          echo "Deployed $URL" >> "$GITHUB_STEP_SUMMARY"
